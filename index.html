<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山河行过 · 同济大学抗战西迁点位史料展</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .point {
            width: 16px;
            height: 16px;
            background: #b91c1c;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .point:hover {
            background: #dc2626;
        }
        .point.active {
            transform: scale(1.5);
            background: #dc2626;
            z-index: 20;
        }
        .point .label {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
            font-size: 13px;
            color: #1f2937;
            background: rgba(255,255,255,0.95);
            padding: 2px 8px;
            border-radius: 4px;
            pointer-events: none;
            transition: all 0.3s ease;
            font-weight: 400;
        }
        .point.active .label {
            font-size: 15px;
            font-weight: 600;
        }
        .sidebar {
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        .sidebar.open { transform: translateX(0); }
        .category-tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 999px;
            display: inline-block;
        }
        .cat-1 { background: #fee2e2; color: #991b1b; }
        .cat-2 { background: #dbeafe; color: #1e40af; }
        .cat-3 { background: #dcfce7; color: #166534; }
        .cat-4 { background: #f3e8ff; color: #6b21a8; }

        /* 长江示意带 */
        .river-band {
            position: absolute;
            top: 10%;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05));
            border-top: 1px solid rgba(59,130,246,0.3);
            border-bottom: 1px solid rgba(59,130,246,0.2);
            pointer-events: none;
        }
        .river-label {
            position: absolute;
            top: calc(10% + 18px);
            left: 20px;
            font-size: 14px;
            color: #1d4ed8;
            letter-spacing: 4px;
            font-weight: 500;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-stone-50 h-screen flex flex-col">
    <!-- 顶部标题栏 -->
    <header class="bg-white shadow-sm px-6 py-4 flex-shrink-0">
        <h1 class="text-xl md:text-2xl font-bold text-stone-800">山河行过 · 同济大学抗战西迁点位史料展</h1>
        <p class="text-sm text-stone-500 mt-1">点击点位查看详情 · 支持AI语音播报</p>
    </header>

    <!-- 主区域：点位总览 -->
    <main class="flex-1 relative overflow-hidden">
        <!-- 长江示意带 -->
        <div class="river-band"></div>
        <div class="river-label">长 江</div>

        <!-- 地图背景区 -->
        <div class="absolute inset-0 bg-gradient-to-br from-stone-100 to-stone-200 flex items-center justify-center">
            <div class="text-stone-400 text-center">
                <p class="text-lg">「 李庄古镇点位分布图 」</p>
                <p class="text-sm mt-2">后续可替换为实景底图</p>
            </div>
        </div>

        <!-- 20个点位标记 -->
        <div id="points-container" class="absolute inset-0"></div>
    </main>

    <!-- 右侧详情弹窗 -->
    <div id="sidebar" class="sidebar fixed right-0 top-0 h-full w-full md:w-[480px] bg-white shadow-2xl z-50 flex flex-col">
        <div class="p-4 border-b flex justify-between items-center">
            <div>
                <span id="point-category" class="category-tag cat-1">核心办学旧址</span>
                <h2 id="point-title" class="text-xl font-bold text-stone-800 mt-2">点位名称</h2>
            </div>
            <button id="close-btn" class="text-stone-400 hover:text-stone-600 text-2xl">&times;</button>
        </div>

        <!-- 图片区 -->
        <div class="w-full h-48 bg-stone-200 flex items-center justify-center flex-shrink-0 relative overflow-hidden">
            <img id="point-image" class="hidden absolute inset-0 w-full h-full object-cover" alt="点位配图">
            <span id="image-placeholder" class="text-stone-400">点位配图占位</span>
        </div>

        <!-- 语音控制栏 -->
        <div class="px-4 py-3 border-b bg-stone-50 flex items-center gap-3">
            <button id="play-btn" class="px-4 py-2 bg-red-600 text-white rounded-md text-sm hover:bg-red-700 transition">
                🔊 AI语音播报
            </button>
            <button id="pause-btn" class="px-4 py-2 border border-stone-300 rounded-md text-sm hover:bg-stone-100 transition">
                暂停
            </button>
            <div class="flex-1 text-xs text-stone-500">浏览器原生AI音色</div>
        </div>

        <!-- 详情文本 -->
        <div class="flex-1 overflow-y-auto p-4">
            <p id="point-desc" class="text-stone-700 leading-relaxed text-sm md:text-base">
                点位介绍内容
            </p>
        </div>
    </div>

    <!-- 底部遮罩 -->
    <div id="overlay" class="fixed inset-0 bg-black/30 z-40 hidden"></div>

    <script>
        // 20个点位数据（已根据史料修正）
        const points = [
            // ===== 核心办学旧址 =====
            {
                id:1, name:"东岳庙", category:"核心办学旧址", catClass:"cat-1",
                desc:"李庄核心庙宇建筑，祀奉泰山神东岳大帝。抗战时期为同济大学工学院与法学院办学地，土木、机械等系科在此设教室与实验室，香案旁推演公式，殿宇间搭建试验台，培养了大批工程技术人才，是同济在战火中接续工科与法学教育的重要旧址。",
                x:25, y:28
            },
            {
                id:2, name:"祖师殿（真武宫）", category:"核心办学旧址", catClass:"cat-1",
                desc:"原为道观，又称真武宫，祀奉玄武祖师，西迁时期辟为同济大学医学院教学场地。师生克服物资匮乏、疫病风险坚持诊疗育人，1941年6月医学院迁往宜宾市区后，这里仍是同济医学“济世救人、救亡图存”传统的历史见证。",
                x:28, y:38
            },
            {
                id:3, name:"南华宫", category:"核心办学旧址", catClass:"cat-1",
                desc:"清代广东移民会馆，祀奉庄子（南华真人），抗战时期为同济大学理学院驻地。物理、化学、生物等学科在此安置仪器，童第周等学者在条件极端艰苦的情况下开展胚胎学研究，青砖黛瓦间留存着中国基础科学在战乱中接续文脉的印记。",
                x:18, y:35
            },
            {
                id:4, name:"禹王宫（现慧光寺）", category:"核心办学旧址", catClass:"cat-1",
                desc:"李庄标志性湖广会馆建筑，祀奉大禹，山门题匾“功奠山河”。西迁时期为同济大学校本部办公地与大礼堂，学校重要会议、开学典礼均在此举办，是战时同济办学秩序的“精神中枢”。师生在此度过了六年相对安定的教学生活。",
                x:35, y:26
            },
            {
                id:5, name:"张家祠", category:"核心办学旧址", catClass:"cat-1",
                desc:"以百鹤祥云窗闻名的宗族祠堂，抗战时期接纳内迁文教机构，是李庄士绅腾挪空间、护持办学的缩影。地方敞开宗祠迎学府，大学携来文脉润古镇，是校地双向奔赴、同心共济的生动注脚。",
                x:18, y:25
            },
            {
                id:6, name:"紫云宫（王爷庙）", category:"核心办学旧址", catClass:"cat-1",
                desc:"又称王爷庙，供奉东海龙王，西迁时期为同济大学图书馆驻地，保障战时图书文献流转。与禹王宫、东岳庙、祖师殿、南华宫等祠宇共同拼成“整个古镇即是大学”的独特办学图景。",
                x:42, y:30
            },
            {
                id:7, name:"童第周旧居", category:"核心办学旧址", catClass:"cat-1",
                desc:"著名生物学家童第周李庄时期的居所与研究地。西迁岁月中，他在条件极端艰苦的情况下做出国际水准的胚胎学成果，是“艰苦治学、科学报国”西迁学者精神的人格化地标。",
                x:32, y:42
            },
            {
                id:8, name:"罗集成公祠（罗家祠）", category:"核心办学旧址", catClass:"cat-1",
                desc:"李庄乡绅罗南陔的祖祠，抗战时期无偿提供给同济大学附设高级工业职业学校办学。木匾铭文记载“士绅罗南陔以其祖集成公祠相假，且不受租金，附职师生始克絃诵不辍”，是校地情谊的生动见证，培养了大批实用技术人才。",
                x:12, y:50
            },
            {
                id:9, name:"同济大道·同济广场", category:"核心办学旧址", catClass:"cat-1",
                desc:"以“同济”命名的当代城镇地标，镌刻着校地交融的深厚情谊。同济广场临江矗立双帆造型的《李庄同济纪念碑》。纪念碑建于2006年，碑文415字，由同济大学文法学院教授喻大翔撰写，记述抗战时期同济大学迁李庄始末，是西迁历史从战时记忆走向当代传承的空间符号。",
                x:15, y:20
            },
            {
                id:10, name:"李庄同济医院（院史馆）", category:"核心办学旧址", catClass:"cat-1",
                desc:"前身可追溯至西迁时期同济医学院开设的地方诊疗机构。当年师生为民众诊病防疫、普及医术，开创同济服务川南医疗的传统。院史馆藏有大量校史文物与诊疗史料，是“科教报国、服务地方”精神的鲜活载体。",
                x:45, y:40
            },

            // ===== 文化抗战地标 =====
            {
                id:11, name:"李庄文化抗战博物馆", category:"文化抗战地标", catClass:"cat-2",
                desc:"位于月亮田景区，2022年4月正式开馆，由同济大学建筑设计研究院章明教授领衔设计。以“文化脊梁·中国李庄”为主题，设序厅、家国情怀·大义李庄、风雨共济·文化抗战、薪火永续·共谱华章、尾厅五个部分。馆内展有“十六字电文”艺术装置、同济大学感赠罗南陔木匾复制品、踊跃参军场景群雕等，系统再现李庄文化抗战的完整历史。",
                x:20, y:45
            },
            {
                id:12, name:"中国营造学社陈列馆·梁林旧居", category:"文化抗战地标", catClass:"cat-2",
                desc:"位于月亮田景区，由张家大院翻修而成，2022年与文化抗战博物馆同步开馆。抗战时期中国营造学社内迁李庄驻地，梁思成、林徽因在此完成《中国建筑史》等奠基著作。学社与同济工学院建筑学科素有学术互通，共同构成战时中国学术薪火相传的壮阔图景。",
                x:25, y:52
            },
            {
                id:13, name:"栗峰山庄（史语所旧址）", category:"文化抗战地标", catClass:"cat-2",
                desc:"镇郊板栗坳的民国建筑群，抗战时期中央研究院历史语言研究所驻地。傅斯年、陈寅恪等学者在此治学，与同济师生比邻相守，共同营造了“文化抗战、学术救国”的时代氛围。旧址立有《留别李庄栗峰碑铭》，是内迁学人感念李庄的历史见证。",
                x:55, y:18
            },
            {
                id:14, name:"羊街·席子巷旧书店", category:"文化抗战地标", catClass:"cat-2",
                desc:"保留民国风貌的古镇街巷，羊街曾是战时同济学子参军集结地，“羊街军号响”是当年投笔从戎的历史回响。席子巷旧书店藏有大量地方文史与西迁记忆线索。街巷肌理承载着同济师生的日常烟火，是打捞民间记忆、还原生活场景的重要空间。",
                x:22, y:32
            },
            {
                id:15, name:"长江畔青年从军告别地", category:"文化抗战地标", catClass:"cat-2",
                desc:"抗战时期同济学子投笔从戎、告别出发的江畔。纪念碑文“帆樯猎猎破日吟”即咏此景，江涛声声里镌刻着“读书不忘救国”的青年担当，与羊街“军号响”的集结共同构成战时同济青年从军报国的历史图景。",
                x:38, y:18
            },

            // ===== 校地传承与史料阵地 =====
            {
                id:16, name:"宜宾市博物院", category:"校地传承与史料阵地", catClass:"cat-3",
                desc:"藏有国家二级文物“同济大学感赠罗南陔木匾”（又称“徐祝罗匾”），由校长徐诵明撰文、同济高职校长祝元青书丹，是校地情谊的核心实物见证。该匾题刻于1945年，是核验办学史实、补充官方档案的核心史料阵地。",
                x:5, y:35
            },
            {
                id:17, name:"翠屏区“李庄书桌”理论宣讲团", category:"校地传承与史料阵地", catClass:"cat-3",
                desc:"当地传承李庄抗战文化的青年宣讲队伍。实践中将回访交流，调研地方校史传播路径，学习基层宣讲经验，推动校地青年宣讲资源联动共享，让西迁精神在当代持续传播。",
                x:8, y:28
            },
            {
                id:18, name:"李庄中学", category:"校地传承与史料阵地", catClass:"cat-3",
                desc:"同济大学对口支教二十载的合作校。长江边上的同济操场现为李庄中学的操场，从战时李庄士绅护学同济，到新时代同济反哺地方教育，八十年校地情谊在此传承。",
                x:20, y:23
            },

            // ===== 红色教育延伸点位 =====
            {
                id:19, name:"赵一曼纪念馆", category:"红色教育延伸点位", catClass:"cat-4",
                desc:"坐落于翠屏山，纪念抗日民族英雄赵一曼。同为救亡图存的精神坐标，与同济西迁科教报国的内核同频共振，是开展爱国主义教育、体悟民族危亡时刻青年担当的重要现场。",
                x:3, y:25
            },
            {
                id:20, name:"李庄管委会", category:"红色教育延伸点位", catClass:"cat-4",
                desc:"开展校地共建座谈，共商西迁点位保护与文化传播，完善实践路线与史料线索，是推动校地合作、深化历史传承的重要对接平台。",
                x:30, y:30
            }
        ];

        const container = document.getElementById('points-container');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('close-btn');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const pointElements = [];
        const pointImage = document.getElementById('point-image');
        const imagePlaceholder = document.getElementById('image-placeholder');
        const IMG_EXTS = ['jpg', 'jpeg', 'png', 'JPG', 'JPEG', 'PNG', 'webp', 'WEBP'];

        // 生成点位
        points.forEach(p => {
            const point = document.createElement('div');
            point.className = 'point';
            point.style.left = p.x + '%';
            point.style.top = p.y + '%';

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = p.name;
            point.appendChild(label);

            point.onclick = () => openPoint(p, point);
            container.appendChild(point);
            pointElements.push(point);
        });

        // 打开点位详情
        function openPoint(point, pointEl) {
            pointElements.forEach(el => el.classList.remove('active'));
            pointEl.classList.add('active');

            document.getElementById('point-title').textContent = point.name;
            document.getElementById('point-category').textContent = point.category;
            document.getElementById('point-category').className = 'category-tag ' + point.catClass;
            document.getElementById('point-desc').textContent = point.desc;
            loadPointImage(point);
            sidebar.classList.add('open');
            overlay.classList.remove('hidden');
            window.speechSynthesis.cancel();
        }

        // 关闭详情
        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.add('hidden');
            window.speechSynthesis.cancel();
            pointElements.forEach(el => el.classList.remove('active'));
        }
        // 加载点位配图（支持 jpg/png 及大小写自动回退）
        function loadPointImage(point) {
            let idx = 0;
            pointImage.onerror = function() {
                idx++;
                if (idx < IMG_EXTS.length) {
                    pointImage.src = 'images/' + point.id + '.' + IMG_EXTS[idx];
                } else {
                    pointImage.classList.add('hidden');
                    imagePlaceholder.classList.remove('hidden');
                }
            };
            pointImage.src = 'images/' + point.id + '.' + IMG_EXTS[0];
            pointImage.classList.remove('hidden');
            imagePlaceholder.classList.add('hidden');
        }
        closeBtn.onclick = closeSidebar;
        overlay.onclick = closeSidebar;

        // AI语音播报
        playBtn.onclick = () => {
            window.speechSynthesis.cancel();
            const text = document.getElementById('point-desc').textContent;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        };
        pauseBtn.onclick = () => {
            window.speechSynthesis.pause();
        };
    </script>
</body>
</html>
