<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山河行过 · 同济大学抗战西迁点位史料展</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .point {
            width: 16px;
            height: 16px;
            background: #b91c1c;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .point:hover {
            background: #dc2626;
        }
        .point.active {
            transform: scale(1.5);
            background: #dc2626;
            z-index: 20;
        }
        .point .label {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
            font-size: 13px;
            color: #1f2937;
            background: rgba(255,255,255,0.95);
            padding: 2px 8px;
            border-radius: 4px;
            pointer-events: none;
            transition: all 0.3s ease;
            font-weight: 400;
        }
        .point.active .label {
            font-size: 15px;
            font-weight: 600;
        }
        .sidebar {
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        .sidebar.open { transform: translateX(0); }
        .category-tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 999px;
            display: inline-block;
        }
        .cat-1 { background: #fee2e2; color: #991b1b; }
        .cat-2 { background: #dbeafe; color: #1e40af; }
        .cat-3 { background: #dcfce7; color: #166534; }
        .cat-4 { background: #f3e8ff; color: #6b21a8; }

        /* 长江示意带 */
        .river-band {
            position: absolute;
            top: 10%;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05));
            border-top: 1px solid rgba(59,130,246,0.3);
            border-bottom: 1px solid rgba(59,130,246,0.2);
            pointer-events: none;
        }
        .river-label {
            position: absolute;
            top: calc(10% + 18px);
            left: 20px;
            font-size: 14px;
            color: #1d4ed8;
            letter-spacing: 4px;
            font-weight: 500;
            pointer-events: none;
        }

        /* 趣味问答 */
        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            border: 1px solid #d6d3d1;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 14px;
            color: #292524;
            line-height: 1.5;
        }
        .quiz-option:hover:not(:disabled) {
            background: #f5f5f4;
            border-color: #a8a29e;
        }
        .quiz-option.correct {
            background: #dcfce7;
            border-color: #16a34a;
            color: #166534;
            font-weight: 600;
        }
        .quiz-option.wrong {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }
        .quiz-option:disabled {
            cursor: default;
        }

        /* 移动端适配 */
        @media (max-width: 640px) {
            .point { width: 12px; height: 12px; }
            .point .label {
                font-size: 11px;
                padding: 1px 5px;
                left: 18px;
            }
        }
    </style>
</head>

                q: "同济大学工学院和法学院共同的办学地是？",
                options: ["南华宫", "祖师殿", "东岳庙", "紫云宫"],
                answer: 2,
                explain: "东岳庙既是工学院、也是法学院的办学地，同济由此发展成为涵盖理工医法的综合性大学。"
            },
            {
                q: "同济医学院的办学地是？",
                options: ["祖师殿（真武宫）", "南华宫", "东岳庙", "张家祠"],
                answer: 0,
                explain: "医学院设在祖师殿（真武宫），1941年6月迁往宜宾市区。"
            },
            {
                q: "同济理学院设在？童第周曾在这里开展胚胎学研究。",
                options: ["东岳庙", "南华宫", "紫云宫", "禹王宫"],
                answer: 1,
                explain: "理学院设在南华宫，童第周等学者在条件极端艰苦的情况下做出了国际水准的胚胎学成果。"
            },
            {
                q: "同济大学图书馆的驻地是？",
                options: ["紫云宫（王爷庙）", "文昌宫", "南华宫", "禹王宫"],
                answer: 0,
                explain: "紫云宫又称王爷庙，西迁时期为同济图书馆驻地，保障战时图书文献流转。"
            },
            {
                q: "乡绅罗南陔将祖祠「集成公祠」无偿借给同济哪所机构办学？",
                options: ["附设高级工业职业学校", "医学院", "法学院", "图书馆"],
                answer: 0,
                explain: "罗南陔以其祖集成公祠相假、且不受租金，供同济附设高级工业职业学校办学。"
            },
            {
                q: "同济第13任校长、中国病理学的开创者和奠基人是？",
                options: ["徐诵明", "罗南陔", "童第周", "喻大翔"],
                answer: 0,
                explain: "徐诵明（1890-1991）是同济第13任校长，著名教育家和病理学家。"
            },
            {
                q: "「徐祝罗匾」（同济大学感赠罗南陔木匾）是？",
                options: ["国家二级文物，题刻于1945年", "国家一级文物，题刻于1945年", "国家二级文物，题刻于1946年", "国家三级文物，题刻于1944年"],
                answer: 0,
                explain: "该匾是国家二级文物，题刻于民国三十四年（1945年），赠予李庄乡绅罗南陔。"
            },
            {
                q: "李庄同济纪念碑建于哪一年？碑文由谁撰写？",
                options: ["2006年，喻大翔", "2000年，喻大翔", "2006年，徐诵明", "2010年，章明"],
                answer: 0,
                explain: "纪念碑建于2006年，碑文415字，由同济大学文法学院教授喻大翔撰写。"
            },
            {
                q: "纪念碑文中「羊街军号响」指的是什么历史场景？",
                options: ["同济学子参军集结", "开学典礼", "校庆活动", "渡江演习"],
                answer: 0,
                explain: "羊街曾是战时同济学子参军集结地，“羊街军号响”是当年投笔从戎的历史回响。"
            },
            {
                q: "同济大学迁入李庄、以及抗战胜利后回迁上海的年份分别是？",
                options: ["1940年迁入，1946年回迁", "1939年迁入，1945年回迁", "1941年迁入，1946年回迁", "1940年迁入，1947年回迁"],
                answer: 0,
                explain: "1940年秋同济迁入李庄，1946年抗战胜利后陆续回迁上海。"
            }
        ];

        const container = document.getElementById('points-container');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('close-btn');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const pointElements = [];
        const pointImage = document.getElementById('point-image');
        const imagePlaceholder = document.getElementById('image-placeholder');
        const IMG_EXTS = ['jpg', 'jpeg', 'png', 'JPG', 'JPEG', 'PNG', 'webp', 'WEBP'];

        // 生成点位
        points.forEach(p => {
            const point = document.createElement('div');
            point.className = 'point';
            point.style.left = p.x + '%';
            point.style.top = p.y + '%';

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = p.name;
            point.appendChild(label);

            point.onclick = () => openPoint(p, point);
            container.appendChild(point);
            pointElements.push(point);
        });

        // 打开点位详情
        function openPoint(point, pointEl) {
            pointElements.forEach(el => el.classList.remove('active'));
            pointEl.classList.add('active');

            document.getElementById('point-title').textContent = point.name;
            document.getElementById('point-category').textContent = point.category;
            document.getElementById('point-category').className = 'category-tag ' + point.catClass;
            document.getElementById('point-desc').textContent = point.desc;
            loadPointImage(point);
            sidebar.classList.add('open');
            overlay.classList.remove('hidden');
            window.speechSynthesis.cancel();
        }

        // 关闭详情
        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.add('hidden');
            window.speechSynthesis.cancel();
            pointElements.forEach(el => el.classList.remove('active'));
        }
        closeBtn.onclick = closeSidebar;
        overlay.onclick = closeSidebar;

        // 加载点位配图（支持 jpg/png 及大小写自动回退）
        function loadPointImage(point) {
            let idx = 0;
            pointImage.onerror = function() {
                idx++;
                if (idx < IMG_EXTS.length) {
                    pointImage.src = 'images/' + point.id + '.' + IMG_EXTS[idx];
                } else {
                    pointImage.classList.add('hidden');
                    imagePlaceholder.classList.remove('hidden');
                }
            };
            pointImage.src = 'images/' + point.id + '.' + IMG_EXTS[0];
            pointImage.classList.remove('hidden');
            imagePlaceholder.classList.add('hidden');
        }

        // AI语音播报（支持中文音色 + 暂停/继续切换）
        let voices = [];
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }
        function getChineseVoice() {
            if (voices.length === 0) {
                voices = window.speechSynthesis.getVoices();
            }
            return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
        }
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        playBtn.onclick = () => {
            window.speechSynthesis.cancel();
            const text = document.getElementById('point-desc').textContent;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.95;
            const voice = getChineseVoice();
            if (voice) utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
            pauseBtn.textContent = '暂停';
        };
        pauseBtn.onclick = () => {
            if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
                window.speechSynthesis.pause();
                pauseBtn.textContent = '继续';
            } else if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                pauseBtn.textContent = '暂停';
            }
        };

        // ===== 趣味问答 =====
        const quizBtn = document.getElementById('quiz-btn');
        const quizOverlay = document.getElementById('quiz-overlay');
        const quizCloseBtn = document.getElementById('quiz-close-btn');
        const quizQuestionArea = document.getElementById('quiz-question-area');
        const quizQuestionEl = document.getElementById('quiz-question');
        const quizOptionsEl = document.getElementById('quiz-options');
        const quizExplainEl = document.getElementById('quiz-explain');
        const quizProgressEl = document.getElementById('quiz-progress');
        const quizScoreEl = document.getElementById('quiz-score');
        const quizNextBtn = document.getElementById('quiz-next-btn');
        const quizResultEl = document.getElementById('quiz-result');
        const quizResultScoreEl = document.getElementById('quiz-result-score');
        const quizResultCommentEl = document.getElementById('quiz-result-comment');
        const quizRestartBtn = document.getElementById('quiz-restart-btn');

        let quizQuestions = [];
        let quizIndex = 0;
        let quizScore = 0;

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function openQuiz() {
            quizQuestions = shuffle(quizBank).slice(0, 5);
            quizIndex = 0;
            quizScore = 0;
            quizResultEl.classList.add('hidden');
            quizQuestionArea.classList.remove('hidden');
            quizNextBtn.classList.remove('hidden');
            quizRestartBtn.classList.add('hidden');
            quizOverlay.classList.remove('hidden');
            window.speechSynthesis.cancel();
            renderQuiz();
        }

        function closeQuiz() {
            quizOverlay.classList.add('hidden');
        }

        function renderQuiz() {
            const q = quizQuestions[quizIndex];
            quizProgressEl.textContent = '第 ' + (quizIndex + 1) + ' / ' + quizQuestions.length + ' 题';
            quizScoreEl.textContent = '得分：' + quizScore;
            quizQuestionEl.textContent = q.q;
            quizExplainEl.classList.add('hidden');
            quizNextBtn.classList.add('hidden');
            quizOptionsEl.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = opt;
                btn.onclick = () => answerQuiz(i);
                quizOptionsEl.appendChild(btn);
            });
        }

        function answerQuiz(choice) {
            const q = quizQuestions[quizIndex];
            const btns = quizOptionsEl.querySelectorAll('button');
            btns.forEach(b => { b.disabled = true; });
            if (choice === q.answer) {
                quizScore++;
                btns[choice].classList.add('correct');
            } else {
                btns[choice].classList.add('wrong');
                btns[q.answer].classList.add('correct');
            }
            quizScoreEl.textContent = '得分：' + quizScore;
            quizExplainEl.textContent = '解析：' + q.explain;
            quizExplainEl.classList.remove('hidden');
            quizNextBtn.textContent = (quizIndex < quizQuestions.length - 1) ? '下一题' : '查看结果';
            quizNextBtn.classList.remove('hidden');
        }

        function nextQuiz() {
            quizIndex++;
            if (quizIndex >= quizQuestions.length) {
                showResult();
            } else {
                renderQuiz();
            }
        }

        function showResult() {
            quizQuestionArea.classList.add('hidden');
            quizNextBtn.classList.add('hidden');
            quizResultScoreEl.textContent = quizScore + ' / ' + quizQuestions.length;
            let comment;
            if (quizScore === 5) {
                comment = '满分！你是当之无愧的同济校史达人！';
            } else if (quizScore >= 3) {
                comment = '很不错！再逛逛点位，冲击满分吧。';
            } else {
                comment = '别灰心，回到点位图里找找答案，再来挑战一次！';
            }
            quizResultCommentEl.textContent = comment;
            quizResultEl.classList.remove('hidden');
            quizRestartBtn.classList.remove('hidden');
        }

        quizBtn.onclick = openQuiz;
        quizCloseBtn.onclick = closeQuiz;
        quizNextBtn.onclick = nextQuiz;
        quizRestartBtn.onclick = openQuiz;
    </script>
</body>
</html>
